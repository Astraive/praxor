name: governance
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - ready_for_review
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  contribution:
    name: Governance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Exercise contribution and link-check cases
      run: python scripts/governance.py self-test
      shell: bash
    - name: Check docs and current contribution
      shell: bash
      env:
        GOV_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        GOV_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        args=(check --event "$GITHUB_EVENT_PATH")
        if [[ -n "$GOV_BASE" && "$GOV_BASE" != 0000000000000000000000000000000000000000 ]]; then
          args+=(--base "$GOV_BASE" --head "$GOV_HEAD")
        fi
        python scripts/governance.py "${args[@]}"
