[package]
name = "praxis"
version = "0.0.1"
edition = "2024"
authors = ["NeerajCodz <neerajcodz@gmail.com>"]
description = "Primitive-first universal storage kernel for Poiesis"
license = "Apache-2.0"

[dependencies]
blake3 = "1.5"
bytes = { version = "1.10", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
axum = "0.8"
lz4_flex = "0.11"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "0.9"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.13"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "engine_write_path"
path = "benches/durability/write_path_bench.rs"
harness = false

[features]
default = ["cpu"]
cpu = []
gpu = []
gpu-wgpu = ["gpu"]
gpu-cuda = ["gpu"]
gpu-vulkan = ["gpu"]
gpu-metal = ["gpu"]

[[bench]]
name = "kv_storage"
path = "benches/kv/storage_bench.rs"
harness = false

[[bench]]
name = "concurrency_mixed_workload"
